<style>

  }
  h1,h2,.display{

  .logo-row{

  }
  .title{

  }
  .card{

    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
  }
  .btn{

    border:none;

  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--magenta); color:#1A0B2E; }
  .btn-secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn-cyan{ background:var(--cyan); color:#1A0B2E; }
  .btn-gold{ background:var(--gold); color:#1A0B2E; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn[disabled]{ opacity:0.35; cursor:not-allowed; }

  input[type=text]{
    width:100%;
    background:var(--bg-soft);
    border:1.5px solid var(--line);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:16px;
    padding:14px 16px;
    border-radius:14px;
    outline:none;
  }
  input[type=text]:focus{ border-color:var(--magenta); }

  .emoji-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:8px;
    margin:12px 0 16px 0;
  }
  .emoji-opt{
    font-size:22px;
    padding:8px 0;
    text-align:center;
    border-radius:10px;
    background:var(--bg-soft);
    border:2px solid transparent;

  }
  .emoji-opt.selected{ border-color:var(--magenta); background:rgba(255,62,154,0.15); }
  .emoji-opt.taken{ opacity:0.25; cursor:not-allowed; }

  .player-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background:var(--bg-soft);
    border-radius:14px;
    margin-bottom:8px;
    border-left:4px solid var(--team-color, var(--magenta));
  }
  .player-row .name{ font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .player-row .remove{ color:var(--ink-dim); cursor:pointer; font-size:13px; background:none; border:none; flex-shrink:0; }
  .team-tag{
    font-size:11px;
    padding:3px 8px;
    border-radius:10px;
    border:1px solid;
    white-space:nowrap;
    flex-shrink:0;
  }

  .team-name-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .team-color-dot{

  .category-grid{

  .rank-name{ font-weight:700; flex:1; }
  .rank-pts{ font-family:'Baloo 2'; color:var(--gold); font-weight:700; }

    color:var(--ink-dim);

  /* Mic drop celebration overlay */
  .mic-drop-overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:50;
    opacity:0;
  }
  .mic-drop-overlay.show{
    animation:micdrop 1.1s ease forwards;
  }
  .mic-drop-content{

  }
  .mic-drop-emoji{

  }
  .mic-drop-text{
    font-family:'Baloo 2';
    font-size:26px;
    color:var(--gold);
    margin-top:6px;
    text-shadow:0 2px 12px rgba(0,0,0,0.5);
  }
  @keyframes micdrop{
    0%{ opacity:0; transform:scale(0.6) translateY(-40px) rotate(-8deg); }
    20%{ opacity:1; transform:scale(1.15) translateY(0) rotate(4deg); }
    35%{ transform:scale(1) rotate(-2deg); }
    75%{ opacity:1; transform:scale(1) rotate(0deg); }
    100%{ opacity:0; transform:scale(1) translateY(10px); }
  }
</style>
</head>

<script>
const HEARTS = [

  { emoji: '🧡', color: '#FF8C42', name: 'Naranja' },
  { emoji: '💛', color: '#FFD93C', name: 'Amarillo' },
  { emoji: '💚', color: '#4CD964', name: 'Verde' },
  { emoji: '💙', color: '#3EA6FF', name: 'Azul' },
  { emoji: '💜', color: '#B565F5', name: 'Morado' },
  { emoji: '🩷', color: '#FF6FB5', name: 'Rosa' },
  { emoji: '🩵', color: '#5FE3E8', name: 'Celeste' },
  { emoji: '🤎', color: '#B5793D', name: 'Café' },

// Second identifier set (Parte 1) — lets the roster grow past the 10 hearts
// up to MAX_PLAYERS without ever repeating a color/emoji pairing.
const FACES = [
  { emoji: '😀', color: '#F2C230', name: 'Sonrisa' },
  { emoji: '😎', color: '#7C89A6', name: 'Cool' },
  { emoji: '🥳', color: '#E040FB', name: 'Fiesta' },
  { emoji: '🤩', color: '#FFB300', name: 'Estrella' },
  { emoji: '😜', color: '#B4E61D', name: 'Travieso' },
  { emoji: '🤠', color: '#C88A3D', name: 'Vaquero' },
  { emoji: '🥸', color: '#2FBFA0', name: 'Disfraz' },
  { emoji: '🧐', color: '#5C6BC0', name: 'Monóculo' },
  { emoji: '🤖', color: '#9AA5B1', name: 'Robot' },
  { emoji: '👽', color: '#39FF88', name: 'Alien' },
];

const IDENTIFIERS = [...HEARTS, ...FACES];
const MAX_PLAYERS = 20;

// Team palette (Parte 2) — separate from player identifier colors so a
// team badge never looks like it's someone's personal heart/face color.
const TEAM_COLORS = ['#FF3E9A', '#00E5CC', '#FFC93C', '#7C4DFF', '#FF7A59', '#2DD4BF'];

const WORD_CATEGORIES = {
  general: {
    label: '🎵 General',
    words: ['amor','noche','baila','corazón','libertad','fuego','locura','soledad','sueños','vida','lágrimas','felicidad','tiempo','recuerdos','distancia','verano','luna','estrella','vino','beso','mentira','esperanza','camino','lluvia','silencio','despertar','volar','libre','tormenta']
  },
  reggaeton: {
    label: '🔥 Reggaetón',
    words: ['perreo','gata','discoteca','wasap','despecho','bellaqueo','tiraera','flow','cintura','fiel','traicionera','bandida','sola','celular','pantalón','equivocada','remix','calle','mala mía','dembow']
  },
  rock_espanol: {
    label: '🎸 Rock en español',
    words: ['rebelde','maldito','desesperado','ausencia','clavado','veneno','distancia','ojos','fantasma','herida','vacío','frontera','cicatriz','huracán','papel','mentiroso','sangre','matador','ciudad','locura']
  },
  retro: {
    label: '📼 2000s / Retro',
    words: ['celular','messenger','discman','video','popular','colegio','chat','fiesta','graduación','pantalón','mall','walkman','antena','cassette','disco','friend','crush','recreo','patineta','videojuego']
  },
  telenovelas: {
    label: '📺 Telenovelas',
    words: ['traición','venganza','herencia','gemela','embarazo','secreto','amante','hermano','villana','boda','divorcio','hijo perdido','testamento','desamor','rival','pobre','rica','chofer','mansión','maldición']
  },
  fiesta: {
    label: '🎉 Modo fiesta',
    words: ['amor','fiesta','nostalgia','copas','baile','media noche','confeti','brindis','reencuentro','pasado','abrazo','risas','despedida','juventud','locura','corazón roto','celebrar','amigos','verano','magia']
  },
  emociones: {
    label: '💗 Emociones',
    words: ['amor','tristeza','alegría','miedo','ira','celos','ansiedad','paz','nostalgia','orgullo','culpa','esperanza','desesperación','ternura','pasión','rencor','vergüenza','envidia','gratitud','soledad','euforia','melancolía','calma','angustia','confianza','decepción','admiración','compasión','rabia','dulzura','nervios','incertidumbre','plenitud','vacío','ilusión','desamor','cariño','indiferencia','arrepentimiento','valentía','debilidad','sorpresa','alivio']
  },
  tiempo_espacio: {
    label: '🌌 Tiempo y espacio',
    words: ['ahora','siempre','nunca','ayer','mañana','madrugada','instante','eternidad','momento','futuro','pasado','presente','minuto','segundo','año','semana','aquí','allá','cerca','lejos','arriba','abajo','adentro','afuera','horizonte','universo','infinito','distancia','rincón','frontera','camino','destino','rumbo','atardecer','amanecer','medianoche','invierno','verano','otoño','primavera','día','noche','tiempo']
  },
  acciones_movimiento: {
    label: '🏃 Acciones y movimiento',
    words: ['baila','corre','salta','gira','vuela','camina','abraza','besa','grita','susurra','llora','ríe','sueña','despierta','escapa','regresa','persigue','escucha','mira','toca','canta','suelta','agarra','empuja','cae','levanta','tropieza','avanza','retrocede','choca','brinca','nada','conduce','maneja','viaja','construye','destruye','rompe','arregla','enciende','apaga','respira','tiembla']
  },
  relaciones_personas: {
    label: '👥 Relaciones y personas',
    words: ['amigo','amiga','novio','novia','ex','hermano','hermana','madre','padre','familia','extraño','vecino','rival','aliado','compañero','pareja','amante','desconocido','mejor amigo','cómplice','enemigo','confidente','mentor','jefe','colega','exnovio','exnovia','crush','alma gemela','media naranja','compadre','comadre','tío','tía','abuelo','abuela','primo','prima','suegra','cuñado','gente','multitud','squad']
  },
  fiesta_diversion: {
    label: '🎊 Fiesta y diversión',
    words: ['antro','borrachera','resaca','shot','brindis','karaoke','pista','DJ','altavoz','luces','botella','cover','entrada','previa','after','disfraz','cumpleaños','boda','graduación','despedida de soltera','asado','carnaval','feria','concierto','mosh pit','banda','playlist','remix','coreografía','conga','trago','cheve','tequila','cotorreo','desmadre','relajo','vacilón','alboroto','algarabía','jolgorio','parranda','reventón','pachanga']
  },
  lugares_viajes: {
    label: '🗺️ Lugares y viajes',
    words: ['playa','ciudad','pueblo','montaña','desierto','selva','río','mar','océano','isla','aeropuerto','estación','carretera','avión','tren','barco','maleta','pasaporte','hotel','casa','calle','plaza','mercado','bar','cielo','tierra','puente','túnel','faro','bosque','valle','cascada','volcán','capital','barrio','terminal','andén','mapa','brújula','aventura','excursión','campamento','litoral']
  },
  conceptos_simbolos: {
    label: '🔮 Conceptos y símbolos',
    words: ['libertad','destino','suerte','magia','fe','verdad','mentira','poder','dinero','éxito','fracaso','honor','justicia','karma','energía','aura','símbolo','corona','espejo','sombra','luz','oscuridad','equilibrio','caos','orden','misterio','secreto','ilusión','realidad','sueño','pesadilla','alma','espíritu','corazón','mente','universo','infinito','eternidad','paraíso','infierno','milagro','destello','esencia']
  }
};

const GENRES = ['Banda','Reggaetón','Grupero/Norteño','Boyband','Pop','Rock en español','Bachata','Trap','Cumbia','Mariachi','R&B','K-pop','Corridos','Salsa'];

function pickGenre(){
  return GENRES[Math.floor(Math.random() * GENRES.length)];
}

let state = {
  scene: 'setup', // setup, round, validate, final
  players: [],
  nameInput: '',
  emojiInput: IDENTIFIERS[0].emoji,
  turnIndex: 0,
  round: 1,
  currentWord: null,
  usedWords: [],
  // Palabras descartadas con "Cambiar palabra" — a diferencia de usedWords,
  // esto NUNCA se vacía dentro de la misma partida (ni siquiera cuando
  // usedWords se reinicia por agotar el banco), porque una palabra
  // descartada debe quedar fuera por el resto de la partida completa.
  // Sí se reinicia al empezar una partida nueva (revancha/modo fiesta).
  discardedWords: [],
  selectedCategories: ['general'],
  mode: 'clasico', // clasico, rapido, actuacion, duelo
  gamePlus: false,
  currentGenre: null,
  plusFulfilled: false,
  timer: 15,
  timerActive: false,
  timerInterval: null,
  duelPlayers: [],
  actuacionStars: 0,
  bonusCoreo: false,

  // Parte 3 — flujo de ronda: "turnos" (comportamiento original, sin
  // cambios) o "carrera" (nadie tiene turno asignado; el grupo elige quién
  // cantó primero después de que alguien lo hace).
  flowMode: 'turnos',

  // Parte 2 — formato de equipo. El puntaje SIEMPRE se guarda por jugador
  // individual (players[i].score) — "teams" solo agrupa jugadores para el
  // ranking final; nunca es una fuente de puntaje independiente.
  teamMode: 'individual', // 'individual' | 'equipos'
  numTeams: 2,
  teams: [], // { id, name, color }
  teamInput: null, // equipo seleccionado en el setup al agregar un jugador
  expandedTeam: null, // id del equipo con detalle expandido en el ranking final

  // Carrera al micrófono
  carreraPicking: false, // true mientras se muestra el selector "¿quién cantó?"
  carreraWinnerIndex: null, // índice en state.players del jugador elegido
};

// En flujo "turnos" el jugador activo es turnIndex (como siempre). En
// "carrera" es quien el grupo eligió en el selector post-canción. Todos los
// handlers de puntaje pasan por aquí para no bifurcar la lógica de sumar
// puntos entre los dos flujos.
function activeIndex(){
  return state.flowMode === 'carrera' ? state.carreraWinnerIndex : state.turnIndex;
}

function teamById(id){
  return state.teams.find(t => t.id === id);
}

// Reconstruye state.teams a partir de state.numTeams, conservando nombre y
// color de los equipos que ya existían (para no perder el nombre editado si
// solo se cambia la cantidad). Reasigna al primer equipo a cualquier jugador
// cuyo equipo haya dejado de existir (p.ej. bajaron de 5 a 3 equipos).
function ensureTeams(){
  const teams = [];
  for(let i = 0; i < state.numTeams; i++){
    teams.push(state.teams[i] || {
      id: 'team' + i,
      name: 'Equipo ' + (i + 1),
      color: TEAM_COLORS[i % TEAM_COLORS.length],
    });
  }
  const validIds = teams.map(t => t.id);
  state.players.forEach(p => {
    if(p.teamId && !validIds.includes(p.teamId)) p.teamId = teams[0] ? teams[0].id : null;
  });
  state.teams = teams;
  if(!state.teamInput || !validIds.includes(state.teamInput)){
    state.teamInput = teams[0] ? teams[0].id : null;
  }
}

function currentWordPool(){
  let pool = [];
  state.selectedCategories.forEach(catId => {
    pool = pool.concat(WORD_CATEGORIES[catId].words);
  });
  if(pool.length === 0) pool = WORD_CATEGORIES.general.words;
  return [...new Set(pool)];
}

// ---------- SOUND: synthesized mic drop thump ----------
let audioCtx = null;
function playMicDropSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const now = ctx.currentTime;

    // deep thump
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(45, now + 0.35);
    gain.gain.setValueAtTime(0.9, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.45);

    // short noise "crack" on top
    const bufferSize = ctx.sampleRate * 0.08;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.5, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    noise.connect(noiseGain).connect(ctx.destination);
    noise.start(now);
  }catch(e){ /* audio not available, fail silently */ }
}

function showMicDropOverlay(text){
  const overlay = document.getElementById('micDropOverlay');
  const textEl = document.getElementById('micDropText');
  textEl.textContent = text;
  overlay.classList.remove('show');
  void overlay.offsetWidth; // restart animation
  overlay.classList.add('show');
  playMicDropSound();
}

// ---------- ROUND ----------
function pickWord(){
  const fullBank = currentWordPool();
  // discardedWords se resta primero y nunca se reinicia dentro de la
  // partida (a diferencia de usedWords, que sí se reinicia abajo cuando se
  // agota) — si llegara a excluir el banco entero, se ignora esa vez para
  // no trabar el juego (caso extremo, categorías chicas + muchos descartes).
  const bank = fullBank.filter(w => !state.discardedWords.includes(w));
  const effectiveBank = bank.length ? bank : fullBank;
  const available = effectiveBank.filter(w => !state.usedWords.includes(w));
  const pool = available.length ? available : effectiveBank;
  if(!available.length) state.usedWords = [];
  const word = pool[Math.floor(Math.random() * pool.length)];
  state.usedWords.push(word);
  state.currentWord = word;
  state.currentGenre = state.gamePlus ? pickGenre() : null;
}

function playerChipLabel(p){
  const team = state.teamMode === 'equipos' ? teamById(p.teamId) : null;
  return `${p.emoji} ${p.name}${team ? ` <span style="color:${team.color};font-size:12px;">· ${team.name}</span>` : ''}`;
}

function renderFinal(){
  const medals = ['🥇','🥈','🥉'];

  if(state.teamMode === 'equipos' && state.teams.length > 0){
    const teamTotals = state.teams.map(t => {
      const members = state.players.filter(p => p.teamId === t.id).sort((a,b) => b.score - a.score);
      const total = members.reduce((sum,p) => sum + p.score, 0);
      return { team: t, members, total };

    const rows = teamTotals.map((entry, i) => {
      const expanded = state.expandedTeam === entry.team.id;

// ---------- SHARE RANKING AS IMAGE ----------
// Nota: la tarjeta compartible siempre dibuja el ranking individual, incluso
// en modo Equipos — extender el canvas para agrupar por equipo no se hizo en
// este cambio (fuera de alcance del pedido); el ranking en pantalla sí queda
// agrupado por equipo.
function generateAndShareRanking(){
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // background
  const grad = ctx.createRadialGradient(W*0.15, H*0.05, 20, W*0.15, H*0.05, W*0.9);
  grad.addColorStop(0, '#3A1A5C');
  grad.addColorStop(1, '#1A0B2E');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // header
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFC93C';
  ctx.font = '700 30px Arial';
  ctx.fillText('🎤💥 DropTheMike', W/2, 60);
  ctx.fillStyle = '#B7A8D9';
  ctx.font = '400 16px Arial';
  ctx.fillText('Ranking final', W/2, 90);

  const sorted = [...state.players].sort((a,b) => b.score - a.score);
  const medals = ['🥇','🥈','🥉'];
  let y = 150;
  const rowH = 74;

  sorted.forEach((p, i) => {
    const rowY = y + i * rowH;
    // row background
    ctx.fillStyle = i===0 ? 'rgba(255,201,60,0.18)' : i===1 ? 'rgba(245,240,255,0.08)' : i===2 ? 'rgba(255,62,154,0.12)' : 'rgba(255,255,255,0.05)';
    roundRect(ctx, 40, rowY, W-80, rowH-14, 16);
    ctx.fill();

    // medal / rank
    ctx.textAlign = 'left';
    ctx.font = '32px Arial';
    ctx.fillStyle = '#F5F0FF';
    ctx.fillText(medals[i] || `${i+1}.`, 60, rowY + 42);

    // emoji + name
    ctx.font = '26px Arial';
    ctx.fillText(p.emoji, 120, rowY + 42);
    ctx.font = '600 22px Arial';
    ctx.fillStyle = '#F5F0FF';
    ctx.fillText(p.name, 165, rowY + 42);

    // score
    ctx.textAlign = 'right';
    ctx.font = '700 24px Arial';
    ctx.fillStyle = '#FFC93C';
    ctx.fillText(`${p.score} pts`, W-60, rowY + 42);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#B7A8D9';
  ctx.font = '400 14px Arial';
  ctx.fillText('Jugado con DropTheMike 🎶', W/2, H-30);

  canvas.toBlob(async (blob) => {
    const fileName = 'dropthemike-ranking.png';
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], title: 'DropTheMike', text: '¡Mira el ranking de nuestro juego!' });
        return;
      }catch(e){ /* user cancelled or share failed, fall back to download */ }
    }
    // fallback: download
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ---------- HANDLERS ----------
function attachHandlers(){
  // setup
  const nameInput = document.getElementById('nameInput');
  if(nameInput){
    nameInput.oninput = (e) => { state.nameInput = e.target.value; };
    nameInput.onkeydown = (e) => { if(e.key === 'Enter') addPlayer(); };
  }
  document.querySelectorAll('[data-emoji]').forEach(el => {
    el.onclick = () => { if(!el.dataset.emoji) return; state.emojiInput = el.dataset.emoji; render(); };
  });
  const addBtn = document.getElementById('addPlayer');
  if(addBtn) addBtn.onclick = addPlayer;
  document.querySelectorAll('[data-remove]').forEach(el => {
    el.onclick = () => { state.players.splice(parseInt(el.dataset.remove),1); render(); };
  });
  document.querySelectorAll('[data-category]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.category;
      if(state.selectedCategories.includes(id)){
        if(state.selectedCategories.length > 1){
          state.selectedCategories = state.selectedCategories.filter(c => c !== id);
        }
      } else {
        state.selectedCategories.push(id);
      }
      render();
    };
  });
  document.querySelectorAll('[data-gamemode]').forEach(el => {
    el.onclick = () => { state.gamePlus = (el.dataset.gamemode === 'plus'); render(); };
  });
  document.querySelectorAll('[data-flowmode]').forEach(el => {
    el.onclick = () => {
      state.flowMode = el.dataset.flowmode;
      // Duelo no existe en Carrera — si venían de Por turnos con Duelo activo,
      // cae a Clásico para no dejar seleccionado un modo que ya no se muestra.
      if(state.flowMode === 'carrera' && state.mode === 'duelo') state.mode = 'clasico';
      render();
    };
  });
  document.querySelectorAll('[data-teammode]').forEach(el => {
    el.onclick = () => {
      state.teamMode = el.dataset.teammode;
      if(state.teamMode === 'equipos') ensureTeams();
      render();
    };
  });
  document.querySelectorAll('[data-numteams]').forEach(el => {
    el.onclick = () => {
      state.numTeams = parseInt(el.dataset.numteams);
      ensureTeams();
      render();
    };
  });
  document.querySelectorAll('[data-teamname]').forEach(el => {
    // Sin render() aquí a propósito — re-renderizar en cada tecla le quita
    // el foco al input (mismo motivo por el que nameInput tampoco lo hace).
    el.oninput = (e) => {
      const team = teamById(el.dataset.teamname);
      if(team) team.name = e.target.value;
    };
  });
  document.querySelectorAll('[data-teaminput]').forEach(el => {
    el.onclick = () => { state.teamInput = el.dataset.teaminput; render(); };
  });
  const startBtn = document.getElementById('startGame');
  if(startBtn) startBtn.onclick = () => { state.scene = 'round'; pickWord(); render(); };

  // round
  document.querySelectorAll('[data-mode]').forEach(el => {
    el.onclick = () => {
      state.mode = el.dataset.mode;
      if(state.mode !== 'duelo') state.duelPlayers = [];
      clearInterval(state.timerInterval);
      state.timer = 15; state.timerActive = false;
      render();
    };
  });
  document.querySelectorAll('[data-duel]').forEach(el => {
    el.onclick = () => {
      const idx = parseInt(el.dataset.duel);
      if(state.duelPlayers.includes(idx)){
        state.duelPlayers = state.duelPlayers.filter(x => x !== idx);
      } else if(state.duelPlayers.length < 2){
        state.duelPlayers.push(idx);
      }
      render();
    };
  });
  const startTimerBtn = document.getElementById('startTimer');
  if(startTimerBtn) startTimerBtn.onclick = () => {
    state.timerActive = true;
    state.timer = 15;
    render();
    state.timerInterval = setInterval(() => {
      state.timer--;
      const timerEl = document.querySelector('.timer');
      if(timerEl) timerEl.textContent = state.timer + 's';
      if(state.timer <= 0){
        clearInterval(state.timerInterval);
        state.timerActive = false;
      }
    }, 1000);
  };
  const toValidate = document.getElementById('toValidate');
  if(toValidate) toValidate.onclick = () => {
    clearInterval(state.timerInterval);
    state.bonusCoreo = false;
    state.actuacionStars = 0;
    state.plusFulfilled = false;
    state.scene = 'validate';
    render();
  };
  const carreraPickBtn = document.getElementById('carreraPickBtn');
  if(carreraPickBtn) carreraPickBtn.onclick = () => { state.carreraPicking = true; render(); };
  const cancelCarreraPick = document.getElementById('cancelCarreraPick');
  if(cancelCarreraPick) cancelCarreraPick.onclick = () => { state.carreraPicking = false; render(); };
  document.querySelectorAll('[data-carrerapick]').forEach(el => {
    el.onclick = () => {
      clearInterval(state.timerInterval);
      state.carreraWinnerIndex = parseInt(el.dataset.carrerapick);
      state.carreraPicking = false;
      state.bonusCoreo = false;
      state.actuacionStars = 0;
      state.plusFulfilled = false;
      state.scene = 'validate';
      render();
    };
  });
  const skipWord = document.getElementById('skipWord');
  if(skipWord) skipWord.onclick = () => {
    if(state.currentWord) state.discardedWords.push(state.currentWord);
    pickWord();
    render();
  };
  const seeScores = document.getElementById('seeScores');
  if(seeScores) seeScores.onclick = () => {
    alert(state.players.map(p => `${p.emoji} ${p.name}: ${p.score} pts`).sort().join('\n'));
  };
  const endGame = document.getElementById('endGame');
  if(endGame) endGame.onclick = () => { state.scene = 'final'; render(); };

  // validate
  const bonusCheck = document.getElementById('bonusCoreo');
  if(bonusCheck) bonusCheck.onchange = (e) => {
    state.bonusCoreo = e.target.checked;
    render();
  };
  const plusCheck = document.getElementById('plusFulfilled');
  if(plusCheck) plusCheck.onchange = (e) => {
    state.plusFulfilled = e.target.checked;
    render();
  };
  const correcto = document.getElementById('correcto');
  if(correcto) correcto.onclick = () => {
    const basePts = state.plusFulfilled ? 10 : 5;
    const pts = basePts + (state.bonusCoreo ? 3 : 0);
    state.players[activeIndex()].score += pts;
    showMicDropOverlay(state.plusFulfilled ? '¡Mic Drop PLUS! 🔥' : '¡Mic Drop!');
    setTimeout(() => nextTurn(), 700);
  };
  const noCuenta = document.getElementById('noCuenta');
  if(noCuenta) noCuenta.onclick = () => { nextTurn(); };

  document.querySelectorAll('[data-star]').forEach(el => {
    el.onclick = () => { state.actuacionStars = parseInt(el.dataset.star); render(); };
  });
  const confirmActuacion = document.getElementById('confirmActuacion');
  if(confirmActuacion) confirmActuacion.onclick = () => {
    const pts = state.actuacionStars * 2 + (state.plusFulfilled ? 10 : 0);
    state.players[activeIndex()].score += pts;
    if(state.actuacionStars >= 4 || state.plusFulfilled){
      showMicDropOverlay(state.plusFulfilled ? '¡Mic Drop PLUS! 🔥' : '¡Mic Drop!');
      setTimeout(() => nextTurn(), 700);
    } else {
      nextTurn();
    }
  };

  document.querySelectorAll('[data-duelwin]').forEach(el => {
    el.onclick = () => {
      const winnerIdx = state.duelPlayers[parseInt(el.dataset.duelwin)];
      const pts = state.plusFulfilled ? 10 : 5;
      state.players[winnerIdx].score += pts;
      state.duelPlayers = [];
      state.mode = 'clasico';
      showMicDropOverlay(`¡${state.players[winnerIdx].name} gana el duelo!${state.plusFulfilled ? ' 🔥' : ''}`);
      setTimeout(() => nextTurn(), 900);
    };
  });

  // final
  document.querySelectorAll('[data-teamdetail]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.teamdetail;
      state.expandedTeam = state.expandedTeam === id ? null : id;
      render();
    };
  });
  const revancha = document.getElementById('revancha');
  if(revancha) revancha.onclick = () => {
    state.players.forEach(p => p.score = 0);
    state.usedWords = [];
    state.discardedWords = [];
    state.round = 1;
    state.turnIndex = 0;
    state.carreraWinnerIndex = null;
    state.carreraPicking = false;
    state.expandedTeam = null;
    state.scene = 'round';
    pickWord();
    render();
  };
  const modoFiesta = document.getElementById('modoFiesta');
  if(modoFiesta) modoFiesta.onclick = () => {
    state.players.forEach(p => p.score = 0);
    state.usedWords = [];
    state.discardedWords = [];
    state.round = 1;
    state.turnIndex = 0;
    state.carreraWinnerIndex = null;
    state.carreraPicking = false;
    state.expandedTeam = null;
    state.selectedCategories = ['fiesta'];
    state.scene = 'round';
    pickWord();
    render();
  };
  const shareRanking = document.getElementById('shareRanking');
  if(shareRanking) shareRanking.onclick = () => { generateAndShareRanking(); };
}

function addPlayer(){
  if(state.players.length >= MAX_PLAYERS) return;
  const name = state.nameInput.trim();
  if(!name) return;
  const ident = IDENTIFIERS.find(h => h.emoji === state.emojiInput) || IDENTIFIERS[0];
  const teamId = state.teamMode === 'equipos' ? state.teamInput : null;
  state.players.push({ name, emoji: ident.emoji, color: ident.color, score: 0, teamId });
  state.nameInput = '';
  const nextFree = IDENTIFIERS.find(h => !state.players.some(p => p.emoji === h.emoji));
  state.emojiInput = nextFree ? nextFree.emoji : IDENTIFIERS[0].emoji;
  render();
}

function nextTurn(){
  if(state.flowMode === 'carrera'){
    // Sin turno fijo que avanzar — cada palabra cantada cuenta como su
    // propia ronda.
    state.round++;
    state.carreraWinnerIndex = null;
  } else {
    state.turnIndex = (state.turnIndex + 1) % state.players.length;
    if(state.turnIndex === 0) state.round++;
  }
  state.currentWord = null;
  state.scene = 'round';
  render();
}

render();
</script>
