<style>
  :root{
    --bg: #1A0B2E;
    --bg-soft: #26123F;
    --card: #2E1650;
    --magenta: #FF3E9A;
    --cyan: #00E5CC;
    --gold: #FFC93C;
    --ink: #F5F0FF;
    --ink-dim: #B7A8D9;
    --line: rgba(245,240,255,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,62,154,0.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(0,229,204,0.14), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  h1,h2,.display{
    font-family:'Baloo 2', sans-serif;
  }
  .logo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }
  .logo-mic{ font-size:26px; }
  .eyebrow{
    color:var(--ink-dim);
    font-size:14px;
    margin:0 0 4px 0;
  }
  .title{
    font-size:28px;
    font-weight:700;
    margin:0 0 20px 0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
  }
  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:14px;
    padding:14px 20px;
    cursor:pointer;
    transition:transform 0.12s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--magenta); color:#1A0B2E; }
  .btn-secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn-cyan{ background:var(--cyan); color:#1A0B2E; }
  .btn-gold{ background:var(--gold); color:#1A0B2E; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn[disabled]{ opacity:0.35; cursor:not-allowed; }

  input[type=text]{
    width:100%;
    background:var(--bg-soft);
    border:1.5px solid var(--line);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:16px;
    padding:14px 16px;
    border-radius:14px;
    outline:none;
  }
  input[type=text]:focus{ border-color:var(--magenta); }

  .emoji-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:8px;
    margin:12px 0 16px 0;
  }
  .emoji-opt{
    font-size:22px;
    padding:8px 0;
    text-align:center;
    border-radius:10px;
    background:var(--bg-soft);
    border:2px solid transparent;
    cursor:pointer;
  }
  .emoji-opt.selected{ border-color:var(--magenta); background:rgba(255,62,154,0.15); }
  .emoji-opt.taken{ opacity:0.25; cursor:not-allowed; }

  .player-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    background:var(--bg-soft);
    border-radius:14px;
    margin-bottom:8px;
    border-left:4px solid var(--team-color, var(--magenta));
  }
  .player-row .name{ font-weight:600; flex:1; }
  .player-row .remove{ color:var(--ink-dim); cursor:pointer; font-size:13px; background:none; border:none; }

  .category-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:12px 0 4px 0;
  }
  .category-opt{
    padding:12px;
    border-radius:14px;
    background:var(--bg-soft);
    border:2px solid transparent;
    cursor:pointer;
    font-size:14px;
    text-align:center;
  }
  .category-opt.selected{ border-color:var(--cyan); color:var(--cyan); background:rgba(0,229,204,0.1); }

  .word-stage{
    text-align:center;
    padding:32px 16px;
    position:relative;
  }
  .word-stage .turn-label{
    color:var(--ink-dim);
    font-size:15px;
    margin-bottom:6px;
  }
  .word-stage .turn-player{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
  }
  .word-display{
    font-size:52px;
    font-weight:800;
    letter-spacing:0.5px;
    color:var(--magenta);
    text-transform:uppercase;
    animation:pop 0.4s ease;
    margin:8px 0 24px 0;
    word-break:break-word;
  }
  @keyframes pop{
    0%{ transform:scale(0.7); opacity:0; }
    70%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  .timer{
    font-family:'Baloo 2';
    font-size:36px;
    color:var(--cyan);
    margin-bottom:8px;
  }
  .badge{
    display:inline-block;
    background:var(--bg-soft);
    color:var(--ink-dim);
    font-size:13px;
    padding:5px 12px;
    border-radius:20px;
    margin:4px 4px 0 0;
    border:1px solid var(--line);
  }
  .mode-toggle{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .mode-chip{
    font-size:13px;
    padding:9px 14px;
    border-radius:20px;
    background:var(--bg-soft);
    border:1.5px solid var(--line);
    cursor:pointer;
    color:var(--ink-dim);
  }
  .mode-chip.active{
    border-color:var(--cyan);
    color:var(--cyan);
    background:rgba(0,229,204,0.1);
  }
  .duel-select{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .duel-chip{
    padding:8px 14px;
    border-radius:12px;
    background:var(--bg-soft);
    border:2px solid transparent;
    cursor:pointer;
    font-size:14px;
  }
  .duel-chip.selected{ border-color:var(--cyan); }

  .stars{
    display:flex;
    gap:6px;
    justify-content:center;
    margin:10px 0 20px 0;
  }
  .star{
    font-size:32px;
    cursor:pointer;
    opacity:0.3;
  }
  .star.on{ opacity:1; }

  .checkbox-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:14px 0;
    font-size:14px;
    color:var(--ink-dim);
  }

  .final-rank{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:20px 0;
  }
  .rank-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-radius:16px;
    background:var(--bg-soft);
  }
  .rank-row.gold{ background:rgba(255,201,60,0.15); border:1.5px solid var(--gold); }
  .rank-row.silver{ background:rgba(245,240,255,0.08); border:1.5px solid var(--ink-dim); }
  .rank-row.bronze{ background:rgba(255,62,154,0.1); border:1.5px solid var(--magenta); }
  .rank-medal{ font-size:26px; }
  .rank-name{ font-weight:700; flex:1; }
  .rank-pts{ font-family:'Baloo 2'; color:var(--gold); font-weight:700; }

  .footer-note{
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    margin-top:16px;
  }
  .center{ text-align:center; }
  .mb-12{ margin-bottom:12px; }
  .mb-20{ margin-bottom:20px; }
  .hidden{ display:none; }

  /* Mic drop celebration overlay */
  .mic-drop-overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:50;
    opacity:0;
  }
  .mic-drop-overlay.show{
    animation:micdrop 1.1s ease forwards;
  }
  .mic-drop-content{
    text-align:center;
  }
  .mic-drop-emoji{
    font-size:80px;
    display:block;
  }
  .mic-drop-text{
    font-family:'Baloo 2';
    font-size:26px;
    color:var(--gold);
    margin-top:6px;
    text-shadow:0 2px 12px rgba(0,0,0,0.5);
  }
  @keyframes micdrop{
    0%{ opacity:0; transform:scale(0.6) translateY(-40px) rotate(-8deg); }
    20%{ opacity:1; transform:scale(1.15) translateY(0) rotate(4deg); }
    35%{ transform:scale(1) rotate(-2deg); }
    75%{ opacity:1; transform:scale(1) rotate(0deg); }
    100%{ opacity:0; transform:scale(1) translateY(10px); }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="mic-drop-overlay" id="micDropOverlay">
  <div class="mic-drop-content">
    <span class="mic-drop-emoji">🎤💥</span>
    <span class="mic-drop-text" id="micDropText">¡Mic Drop!</span>
  </div>
</div>
<canvas id="shareCanvas" width="640" height="760" style="display:none;"></canvas>

<script>
const HEARTS = [
  { emoji: '❤️', color: '#FF3B5C', name: 'Rojo' },
  { emoji: '🧡', color: '#FF8C42', name: 'Naranja' },
  { emoji: '💛', color: '#FFD93C', name: 'Amarillo' },
  { emoji: '💚', color: '#4CD964', name: 'Verde' },
  { emoji: '💙', color: '#3EA6FF', name: 'Azul' },
  { emoji: '💜', color: '#B565F5', name: 'Morado' },
  { emoji: '🩷', color: '#FF6FB5', name: 'Rosa' },
  { emoji: '🩵', color: '#5FE3E8', name: 'Celeste' },
  { emoji: '🤎', color: '#B5793D', name: 'Café' },
  { emoji: '🤍', color: '#F5F0FF', name: 'Blanco' },
];

const WORD_CATEGORIES = {
  general: {
    label: '🎵 General',
    words: ['amor','noche','baila','corazón','libertad','fuego','locura','soledad','sueños','vida','lágrimas','felicidad','tiempo','recuerdos','distancia','verano','luna','estrella','vino','beso','mentira','esperanza','camino','lluvia','silencio','despertar','volar','libre','tormenta']
  },
  reggaeton: {
    label: '🔥 Reggaetón',
    words: ['perreo','gata','discoteca','wasap','despecho','bellaqueo','tiraera','flow','cintura','fiel','traicionera','bandida','sola','celular','pantalón','equivocada','remix','calle','mala mía','dembow']
  },
  rock_espanol: {
    label: '🎸 Rock en español',
    words: ['rebelde','maldito','desesperado','ausencia','clavado','veneno','distancia','ojos','fantasma','herida','vacío','frontera','cicatriz','huracán','papel','mentiroso','sangre','matador','ciudad','locura']
  },
  retro: {
    label: '📼 2000s / Retro',
    words: ['celular','messenger','discman','video','popular','colegio','chat','fiesta','graduación','pantalón','mall','walkman','antena','cassette','disco','friend','crush','recreo','patineta','videojuego']
  },
  telenovelas: {
    label: '📺 Telenovelas',
    words: ['traición','venganza','herencia','gemela','embarazo','secreto','amante','hermano','villana','boda','divorcio','hijo perdido','testamento','desamor','rival','pobre','rica','chofer','mansión','maldición']
  },
  fiesta: {
    label: '🎉 Modo fiesta',
    words: ['amor','fiesta','nostalgia','copas','baile','media noche','confeti','brindis','reencuentro','pasado','abrazo','risas','despedida','juventud','locura','corazón roto','celebrar','amigos','verano','magia']
  }
};

const GENRES = ['Banda','Reggaetón','Grupero/Norteño','Boyband','Pop','Rock en español','Bachata','Trap','Cumbia','Mariachi','R&B','K-pop','Corridos','Salsa'];

function pickGenre(){
  return GENRES[Math.floor(Math.random() * GENRES.length)];
}

let state = {
  scene: 'setup', // setup, round, validate, final
  players: [],
  nameInput: '',
  emojiInput: HEARTS[0].emoji,
  turnIndex: 0,
  round: 1,
  currentWord: null,
  usedWords: [],
  selectedCategories: ['general'],
  mode: 'clasico', // clasico, rapido, actuacion, duelo
  gamePlus: false,
  currentGenre: null,
  plusFulfilled: false,
  timer: 15,
  timerActive: false,
  timerInterval: null,
  duelPlayers: [],
  actuacionStars: 0,
  bonusCoreo: false,
};

function currentWordPool(){
  let pool = [];
  state.selectedCategories.forEach(catId => {
    pool = pool.concat(WORD_CATEGORIES[catId].words);
  });
  if(pool.length === 0) pool = WORD_CATEGORIES.general.words;
  return [...new Set(pool)];
}

// ---------- SOUND: synthesized mic drop thump ----------
let audioCtx = null;
function playMicDropSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const now = ctx.currentTime;

    // deep thump
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(45, now + 0.35);
    gain.gain.setValueAtTime(0.9, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.45);

    // short noise "crack" on top
    const bufferSize = ctx.sampleRate * 0.08;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.5, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    noise.connect(noiseGain).connect(ctx.destination);
    noise.start(now);
  }catch(e){ /* audio not available, fail silently */ }
}

function showMicDropOverlay(text){
  const overlay = document.getElementById('micDropOverlay');
  const textEl = document.getElementById('micDropText');
  textEl.textContent = text;
  overlay.classList.remove('show');
  void overlay.offsetWidth; // restart animation
  overlay.classList.add('show');
  playMicDropSound();
}

function render(){
  const app = document.getElementById('app');
  if(state.scene === 'setup') app.innerHTML = renderSetup();
  else if(state.scene === 'round') app.innerHTML = renderRound();
  else if(state.scene === 'validate') app.innerHTML = renderValidate();
  else if(state.scene === 'final') app.innerHTML = renderFinal();
  attachHandlers();
}

// ---------- SETUP ----------
function renderSetup(){
  const playersHtml = state.players.map((p, i) => `
    <div class="player-row" style="--team-color:${p.color}">
      <span style="font-size:20px">${p.emoji}</span>
      <span class="name">${p.name}</span>
      <button class="remove" data-remove="${i}">quitar</button>
    </div>
  `).join('');

  const emojiGrid = HEARTS.map(h => {
    const takenBy = state.players.find(p => p.emoji === h.emoji);
    const isTaken = !!takenBy;
    const isSelected = state.emojiInput === h.emoji;
    return `
      <div class="emoji-opt ${isSelected?'selected':''} ${isTaken?'taken':''}" data-emoji="${isTaken ? '' : h.emoji}" title="${h.name}${isTaken ? ' — ya en uso' : ''}" style="background:${h.color}22; ${isSelected ? `border-color:${h.color};` : ''}">${h.emoji}</div>
    `;
  }).join('');

  const categoryGrid = Object.keys(WORD_CATEGORIES).map(id => `
    <div class="category-opt ${state.selectedCategories.includes(id)?'selected':''}" data-category="${id}">${WORD_CATEGORIES[id].label}</div>
  `).join('');

  return `
    <div class="logo-row"><span class="logo-mic">🎤💥</span><span class="eyebrow" style="margin:0;">Juego de fiesta</span></div>
    <h1 class="title">DropTheMike</h1>
    <div class="card mb-20">
      <p style="margin-top:0;color:var(--ink-dim);font-size:14px;">Cada jugador canta una canción que contenga la palabra del turno. El grupo decide si vale.</p>
      <input type="text" id="nameInput" placeholder="Nombre del jugador" value="${state.nameInput}" maxlength="18">
      <p style="color:var(--ink-dim);font-size:13px;margin:14px 0 4px 0;">Elige tu corazón — ese color te identifica en todo el juego</p>
      <div class="emoji-grid">${emojiGrid}</div>
      <button class="btn btn-primary btn-block" id="addPlayer">Agregar jugador</button>
    </div>

    ${state.players.length > 0 ? `
      <div class="card mb-20">
        <p style="margin-top:0;font-weight:600;">Jugadores (${state.players.length})</p>
        ${playersHtml}
      </div>
    ` : ''}

    <div class="card mb-20">
      <p style="margin-top:0;font-weight:600;">Categorías de palabras</p>
      <p style="color:var(--ink-dim);font-size:13px;margin-top:-8px;">Elige una o varias, se mezclan en el mismo banco</p>
      <div class="category-grid">${categoryGrid}</div>
    </div>

    <div class="card mb-20">
      <p style="margin-top:0;font-weight:600;">Modo de juego</p>
      <div class="btn-row">
        <div class="mode-chip ${!state.gamePlus?'active':''}" data-gamemode="normal" style="flex:1;text-align:center;">🎙️ Normal</div>
        <div class="mode-chip ${state.gamePlus?'active':''}" data-gamemode="plus" style="flex:1;text-align:center;">🔥 Plus</div>
      </div>
      <p style="color:var(--ink-dim);font-size:13px;margin:10px 0 0 0;">${state.gamePlus ? 'Cada ronda suma un género musical al azar (Banda, Reggaetón, Boyband...). Si la canción cumple la palabra Y el género, valen 10 pts en vez de 5.' : 'Solo se canta con la palabra clave, puntuación estándar.'}</p>
    </div>

    <button class="btn btn-cyan btn-block" id="startGame" ${state.players.length < 2 ? 'disabled' : ''}>
      ${state.players.length < 2 ? 'Agrega al menos 2 jugadores' : 'Comenzar juego →'}
    </button>
    <p class="footer-note">${state.players.length < 2 ? '' : 'Podrás elegir el modo en cada ronda'}</p>
  `;
}

// ---------- ROUND ----------
function pickWord(){
  const bank = currentWordPool();
  const available = bank.filter(w => !state.usedWords.includes(w));
  const pool = available.length ? available : bank;
  if(!available.length) state.usedWords = [];
  const word = pool[Math.floor(Math.random() * pool.length)];
  state.usedWords.push(word);
  state.currentWord = word;
  state.currentGenre = state.gamePlus ? pickGenre() : null;
}

function renderRound(){
  const player = state.players[state.turnIndex];
  if(!state.currentWord) pickWord();

  const modeChips = [
    {id:'clasico', label:'🎙️ Clásico'},
    {id:'rapido', label:'🎲 Rápido'},
    {id:'actuacion', label:'🎭 Actuación'},
    {id:'duelo', label:'🎧 Duelo'},
  ].map(m => `<div class="mode-chip ${state.mode===m.id?'active':''}" data-mode="${m.id}">${m.label}</div>`).join('');

  let duelHtml = '';
  if(state.mode === 'duelo'){
    const chips = state.players.map((p,i) => `
      <div class="duel-chip ${state.duelPlayers.includes(i)?'selected':''}" data-duel="${i}" style="border-color:${state.duelPlayers.includes(i)?p.color:'transparent'}">
        ${p.emoji} ${p.name}
      </div>
    `).join('');
    duelHtml = `<p style="color:var(--ink-dim);font-size:14px;margin-bottom:8px;">Elige 2 jugadores para el duelo:</p><div class="duel-select">${chips}</div>`;
  }

  const timerHtml = state.mode === 'rapido' ? `
    <div class="timer">${state.timer}s</div>
    <div class="btn-row center" style="justify-content:center;margin-bottom:16px;">
      <button class="btn btn-secondary" id="startTimer" ${state.timerActive?'disabled':''}>Iniciar cuenta regresiva</button>
    </div>
  ` : '';

  const turnLabel = state.mode === 'duelo'
    ? (state.duelPlayers.length === 2
        ? `${state.players[state.duelPlayers[0]].emoji} ${state.players[state.duelPlayers[0]].name} vs ${state.players[state.duelPlayers[1]].emoji} ${state.players[state.duelPlayers[1]].name}`
        : 'Selecciona a los duelistas')
    : `${player.emoji} ${player.name}`;

  return `
    <p class="eyebrow">Ronda ${state.round}</p>
    <div class="mode-toggle">${modeChips}</div>
    <div class="card">
      <div class="word-stage">
        ${state.mode !== 'duelo' ? `<p class="turn-label">Le toca a</p><p class="turn-player">${turnLabel}</p>` : `<p class="turn-label">Duelo</p><p class="turn-player">${turnLabel}</p>`}
        <div class="word-display">${state.currentWord}</div>
        ${state.currentGenre ? `<div class="badge" style="border-color:var(--gold);color:var(--gold);font-size:14px;padding:8px 16px;">🔥 Extra: que sea de <strong>${state.currentGenre}</strong> también = 10 pts</div>` : ''}
        ${duelHtml}
        ${timerHtml}
        <p style="color:var(--ink-dim);font-size:13px;margin-top:${state.currentGenre?'14px':'0'};">Debe cantar una canción que contenga esta palabra</p>
      </div>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-primary btn-block" id="toValidate" ${state.mode==='duelo' && state.duelPlayers.length<2 ? 'disabled' : ''}>Ya cantó, calificar →</button>
    </div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-secondary" id="skipWord">🔄 Cambiar palabra</button>
      <button class="btn btn-secondary" id="seeScores">Ver puntajes</button>
      <button class="btn btn-secondary" id="endGame">Terminar juego</button>
    </div>
  `;
}

// ---------- VALIDATE ----------
function renderValidate(){
  if(state.mode === 'actuacion'){
    const starsHtml = [1,2,3,4,5].map(n => `<span class="star ${n<=state.actuacionStars?'on':''}" data-star="${n}">⭐</span>`).join('');
    const plusRow = state.currentGenre ? `
      <div class="checkbox-row" style="justify-content:center;">
        <input type="checkbox" id="plusFulfilled" ${state.plusFulfilled?'checked':''}>
        <label for="plusFulfilled">🔥 También cumplió con ${state.currentGenre} (+10 pts extra)</label>
      </div>
    ` : '';
    const total = state.actuacionStars * 2 + (state.plusFulfilled ? 10 : 0);
    return `
      <p class="eyebrow">Calificar interpretación</p>
      <div class="card center">
        <p class="turn-player" style="margin-top:0;">${state.players[state.turnIndex].emoji} ${state.players[state.turnIndex].name}</p>
        <p style="color:var(--ink-dim);">Palabra: <strong style="color:var(--magenta)">${state.currentWord}</strong></p>
        <p style="color:var(--ink-dim);font-size:14px;">Califica interpretación y energía (cada estrella = 2 puntos)</p>
        <div class="stars">${starsHtml}</div>
        ${plusRow}
        <button class="btn btn-cyan btn-block" id="confirmActuacion">Confirmar (${total} pts)</button>
      </div>
    `;
  }

  if(state.mode === 'duelo'){
    const p1 = state.players[state.duelPlayers[0]];
    const p2 = state.players[state.duelPlayers[1]];
    const plusRow = state.currentGenre ? `
      <div class="checkbox-row" style="justify-content:center;">
        <input type="checkbox" id="plusFulfilled" ${state.plusFulfilled?'checked':''}>
        <label for="plusFulfilled">🔥 El ganador también cumplió con ${state.currentGenre} (10 pts en vez de 5)</label>
      </div>
    ` : '';
    const winPts = state.plusFulfilled ? 10 : 5;
    return `
      <p class="eyebrow">Votación del duelo</p>
      <div class="card center">
        <p style="color:var(--ink-dim);">Palabra: <strong style="color:var(--magenta)">${state.currentWord}</strong></p>
        <p style="color:var(--ink-dim);font-size:14px;margin-bottom:16px;">¿Quién ganó el duelo? (${winPts} pts al ganador)</p>
        ${plusRow}
        <div class="btn-row" style="justify-content:center;">
          <button class="btn btn-gold" data-duelwin="0">${p1.emoji} ${p1.name}</button>
          <button class="btn btn-cyan" data-duelwin="1">${p2.emoji} ${p2.name}</button>
        </div>
      </div>
    `;
  }

  // clasico o rapido
  const player = state.players[state.turnIndex];
  const basePts = state.plusFulfilled ? 10 : 5;
  const plusRow = state.currentGenre ? `
    <div class="checkbox-row" style="justify-content:center;">
      <input type="checkbox" id="plusFulfilled" ${state.plusFulfilled?'checked':''}>
      <label for="plusFulfilled">🔥 También cumplió con ${state.currentGenre} (10 pts en vez de 5)</label>
    </div>
  ` : '';
  return `
    <p class="eyebrow">Calificar</p>
    <div class="card center">
      <p class="turn-player" style="margin-top:0;">${player.emoji} ${player.name}</p>
      <p style="color:var(--ink-dim);">Palabra: <strong style="color:var(--magenta)">${state.currentWord}</strong></p>
      ${plusRow}
      <div class="checkbox-row" style="justify-content:center;">
        <input type="checkbox" id="bonusCoreo" ${state.bonusCoreo?'checked':''}>
        <label for="bonusCoreo">Coreografía improvisada (+3 pts extra)</label>
      </div>
      <div class="btn-row" style="justify-content:center;margin-top:10px;">
        <button class="btn btn-secondary" id="noCuenta">❌ No cuenta</button>
        <button class="btn btn-gold" id="correcto">✅ Correcto (${basePts + (state.bonusCoreo?3:0)} pts)</button>
      </div>
    </div>
  `;
}

// ---------- FINAL ----------
function renderFinal(){
  const sorted = [...state.players].sort((a,b) => b.score - a.score);
  const medals = ['🥇','🥈','🥉'];
  const rows = sorted.map((p, i) => `
    <div class="rank-row ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">
      <span class="rank-medal">${medals[i] || '🎵'}</span>
      <span style="font-size:20px">${p.emoji}</span>
      <span class="rank-name">${p.name}</span>
      <span class="rank-pts">${p.score} pts</span>
    </div>
  `).join('');

  return `
    <div class="logo-row"><span class="logo-mic">🎤💥</span><span class="eyebrow" style="margin:0;">Fin del juego</span></div>
    <h1 class="title">🏆 Ranking final — DropTheMike</h1>
    <div class="final-rank">${rows}</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="revancha">🔁 Revancha</button>
      <button class="btn btn-gold" id="modoFiesta">🎉 Modo fiesta</button>
    </div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-secondary btn-block" id="shareRanking">📸 Compartir ranking</button>
    </div>
  `;
}

// ---------- SHARE RANKING AS IMAGE ----------
function generateAndShareRanking(){
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // background
  const grad = ctx.createRadialGradient(W*0.15, H*0.05, 20, W*0.15, H*0.05, W*0.9);
  grad.addColorStop(0, '#3A1A5C');
  grad.addColorStop(1, '#1A0B2E');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // header
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFC93C';
  ctx.font = '700 30px Arial';
  ctx.fillText('🎤💥 DropTheMike', W/2, 60);
  ctx.fillStyle = '#B7A8D9';
  ctx.font = '400 16px Arial';
  ctx.fillText('Ranking final', W/2, 90);

  const sorted = [...state.players].sort((a,b) => b.score - a.score);
  const medals = ['🥇','🥈','🥉'];
  let y = 150;
  const rowH = 74;

  sorted.forEach((p, i) => {
    const rowY = y + i * rowH;
    // row background
    ctx.fillStyle = i===0 ? 'rgba(255,201,60,0.18)' : i===1 ? 'rgba(245,240,255,0.08)' : i===2 ? 'rgba(255,62,154,0.12)' : 'rgba(255,255,255,0.05)';
    roundRect(ctx, 40, rowY, W-80, rowH-14, 16);
    ctx.fill();

    // medal / rank
    ctx.textAlign = 'left';
    ctx.font = '32px Arial';
    ctx.fillStyle = '#F5F0FF';
    ctx.fillText(medals[i] || `${i+1}.`, 60, rowY + 42);

    // emoji + name
    ctx.font = '26px Arial';
    ctx.fillText(p.emoji, 120, rowY + 42);
    ctx.font = '600 22px Arial';
    ctx.fillStyle = '#F5F0FF';
    ctx.fillText(p.name, 165, rowY + 42);

    // score
    ctx.textAlign = 'right';
    ctx.font = '700 24px Arial';
    ctx.fillStyle = '#FFC93C';
    ctx.fillText(`${p.score} pts`, W-60, rowY + 42);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#B7A8D9';
  ctx.font = '400 14px Arial';
  ctx.fillText('Jugado con DropTheMike 🎶', W/2, H-30);

  canvas.toBlob(async (blob) => {
    const fileName = 'dropthemike-ranking.png';
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], title: 'DropTheMike', text: '¡Mira el ranking de nuestro juego!' });
        return;
      }catch(e){ /* user cancelled or share failed, fall back to download */ }
    }
    // fallback: download
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ---------- HANDLERS ----------
function attachHandlers(){
  // setup
  const nameInput = document.getElementById('nameInput');
  if(nameInput){
    nameInput.oninput = (e) => { state.nameInput = e.target.value; };
    nameInput.onkeydown = (e) => { if(e.key === 'Enter') addPlayer(); };
  }
  document.querySelectorAll('[data-emoji]').forEach(el => {
    el.onclick = () => { if(!el.dataset.emoji) return; state.emojiInput = el.dataset.emoji; render(); };
  });
  const addBtn = document.getElementById('addPlayer');
  if(addBtn) addBtn.onclick = addPlayer;
  document.querySelectorAll('[data-remove]').forEach(el => {
    el.onclick = () => { state.players.splice(parseInt(el.dataset.remove),1); render(); };
  });
  document.querySelectorAll('[data-category]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.category;
      if(state.selectedCategories.includes(id)){
        if(state.selectedCategories.length > 1){
          state.selectedCategories = state.selectedCategories.filter(c => c !== id);
        }
      } else {
        state.selectedCategories.push(id);
      }
      render();
    };
  });
  document.querySelectorAll('[data-gamemode]').forEach(el => {
    el.onclick = () => { state.gamePlus = (el.dataset.gamemode === 'plus'); render(); };
  });
  const startBtn = document.getElementById('startGame');
  if(startBtn) startBtn.onclick = () => { state.scene = 'round'; pickWord(); render(); };

  // round
  document.querySelectorAll('[data-mode]').forEach(el => {
    el.onclick = () => {
      state.mode = el.dataset.mode;
      if(state.mode !== 'duelo') state.duelPlayers = [];
      clearInterval(state.timerInterval);
      state.timer = 15; state.timerActive = false;
      render();
    };
  });
  document.querySelectorAll('[data-duel]').forEach(el => {
    el.onclick = () => {
      const idx = parseInt(el.dataset.duel);
      if(state.duelPlayers.includes(idx)){
        state.duelPlayers = state.duelPlayers.filter(x => x !== idx);
      } else if(state.duelPlayers.length < 2){
        state.duelPlayers.push(idx);
      }
      render();
    };
  });
  const startTimerBtn = document.getElementById('startTimer');
  if(startTimerBtn) startTimerBtn.onclick = () => {
    state.timerActive = true;
    state.timer = 15;
    render();
    state.timerInterval = setInterval(() => {
      state.timer--;
      const timerEl = document.querySelector('.timer');
      if(timerEl) timerEl.textContent = state.timer + 's';
      if(state.timer <= 0){
        clearInterval(state.timerInterval);
        state.timerActive = false;
      }
    }, 1000);
  };
  const toValidate = document.getElementById('toValidate');
  if(toValidate) toValidate.onclick = () => {
    clearInterval(state.timerInterval);
    state.bonusCoreo = false;
    state.actuacionStars = 0;
    state.plusFulfilled = false;
    state.scene = 'validate';
    render();
  };
  const skipWord = document.getElementById('skipWord');
  if(skipWord) skipWord.onclick = () => { pickWord(); render(); };
  const seeScores = document.getElementById('seeScores');
  if(seeScores) seeScores.onclick = () => {
    alert(state.players.map(p => `${p.emoji} ${p.name}: ${p.score} pts`).sort().join('\n'));
  };
  const endGame = document.getElementById('endGame');
  if(endGame) endGame.onclick = () => { state.scene = 'final'; render(); };

  // validate
  const bonusCheck = document.getElementById('bonusCoreo');
  if(bonusCheck) bonusCheck.onchange = (e) => {
    state.bonusCoreo = e.target.checked;
    render();
  };
  const plusCheck = document.getElementById('plusFulfilled');
  if(plusCheck) plusCheck.onchange = (e) => {
    state.plusFulfilled = e.target.checked;
    render();
  };
  const correcto = document.getElementById('correcto');
  if(correcto) correcto.onclick = () => {
    const basePts = state.plusFulfilled ? 10 : 5;
    const pts = basePts + (state.bonusCoreo ? 3 : 0);
    state.players[state.turnIndex].score += pts;
    showMicDropOverlay(state.plusFulfilled ? '¡Mic Drop PLUS! 🔥' : '¡Mic Drop!');
    setTimeout(() => nextTurn(), 700);
  };
  const noCuenta = document.getElementById('noCuenta');
  if(noCuenta) noCuenta.onclick = () => { nextTurn(); };

  document.querySelectorAll('[data-star]').forEach(el => {
    el.onclick = () => { state.actuacionStars = parseInt(el.dataset.star); render(); };
  });
  const confirmActuacion = document.getElementById('confirmActuacion');
  if(confirmActuacion) confirmActuacion.onclick = () => {
    const pts = state.actuacionStars * 2 + (state.plusFulfilled ? 10 : 0);
    state.players[state.turnIndex].score += pts;
    if(state.actuacionStars >= 4 || state.plusFulfilled){
      showMicDropOverlay(state.plusFulfilled ? '¡Mic Drop PLUS! 🔥' : '¡Mic Drop!');
      setTimeout(() => nextTurn(), 700);
    } else {
      nextTurn();
    }
  };

  document.querySelectorAll('[data-duelwin]').forEach(el => {
    el.onclick = () => {
      const winnerIdx = state.duelPlayers[parseInt(el.dataset.duelwin)];
      const pts = state.plusFulfilled ? 10 : 5;
      state.players[winnerIdx].score += pts;
      state.duelPlayers = [];
      state.mode = 'clasico';
      showMicDropOverlay(`¡${state.players[winnerIdx].name} gana el duelo!${state.plusFulfilled ? ' 🔥' : ''}`);
      setTimeout(() => nextTurn(), 900);
    };
  });

  // final
  const revancha = document.getElementById('revancha');
  if(revancha) revancha.onclick = () => {
    state.players.forEach(p => p.score = 0);
    state.usedWords = [];
    state.round = 1;
    state.turnIndex = 0;
    state.scene = 'round';
    pickWord();
    render();
  };
  const modoFiesta = document.getElementById('modoFiesta');
  if(modoFiesta) modoFiesta.onclick = () => {
    state.players.forEach(p => p.score = 0);
    state.usedWords = [];
    state.round = 1;
    state.turnIndex = 0;
    state.selectedCategories = ['fiesta'];
    state.scene = 'round';
    pickWord();
    render();
  };
  const shareRanking = document.getElementById('shareRanking');
  if(shareRanking) shareRanking.onclick = () => { generateAndShareRanking(); };
}

function addPlayer(){
  const name = state.nameInput.trim();
  if(!name) return;
  const heart = HEARTS.find(h => h.emoji === state.emojiInput) || HEARTS[0];
  state.players.push({ name, emoji: heart.emoji, color: heart.color, score: 0 });
  state.nameInput = '';
  const nextFree = HEARTS.find(h => !state.players.some(p => p.emoji === h.emoji));
  state.emojiInput = nextFree ? nextFree.emoji : HEARTS[0].emoji;
  render();
}

function nextTurn(){
  state.turnIndex = (state.turnIndex + 1) % state.players.length;
  if(state.turnIndex === 0) state.round++;
  state.currentWord = null;
  state.scene = 'round';
  render();
}

render();
</script>
</body>
</html>
